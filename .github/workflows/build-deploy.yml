name: Build and Deploy

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'Dockerfile'
      - 'nginx.conf'
      - 'html/**'
      - 'k8s/**'
      - '.github/workflows/build-deploy.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'Dockerfile'
      - 'nginx.conf'
      - 'html/**'
      - 'k8s/**'
  workflow_dispatch:
env:
  REGISTRY: cr.yandex
  REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
  IMAGE_NAME: test-app

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Yandex Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: json_key
          password: ${{ secrets.YC_SA_KEY }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Create registry secret
        env:
          SA_KEY: ${{ secrets.YC_SA_KEY }}
        run: |
          echo "$SA_KEY" > /tmp/sa-key.json
          kubectl create secret docker-registry yc-registry-secret \
            --docker-server=cr.yandex \
            --docker-username=json_key \
            --docker-password="$(cat /tmp/sa-key.json)" \
            --docker-email=test@test.com \
            --dry-run=client -o yaml | kubectl apply -f -
          rm /tmp/sa-key.json

      - name: Deploy to Kubernetes
        env:
          YC_REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
  #        IMAGE_TAG: sha-${GITHUB_SHA::7}
        run: |
          export IMAGE_TAG="sha-${GITHUB_SHA:0:7}"
          envsubst '${YC_REGISTRY_ID} ${IMAGE_NAME} ${IMAGE_TAG}' \
            < k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl rollout status deployment/test-app -n default --timeout=300s
          kubectl get pods -l app=test-app -n default

      - name: Verify deployment
        run: |
          kubectl get deployment test-app -n default -o wide
          kubectl describe deployment test-app -n default
