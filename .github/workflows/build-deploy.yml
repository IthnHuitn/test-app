name: Build and Deploy

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'Dockerfile'
      - 'nginx.conf'
      - 'html/**'
      - 'k8s/**'
      - '.github/workflows/build-deploy.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'Dockerfile'
      - 'nginx.conf'
      - 'html/**'
      - 'k8s/**'
  workflow_dispatch:

env:
  REGISTRY: cr.yandex
  REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
  IMAGE_NAME: test-app

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Yandex Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: json_key
          password: ${{ secrets.YC_SA_KEY }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Compute single image tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=sha-$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi


      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Ensure imagePullSecret
        env:
          YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
        run: |
          kubectl create secret docker-registry yc-registry-secret \
            --docker-server=cr.yandex \
            --docker-username=json_key \
            --docker-password="$YC_SA_KEY" \
            --docker-email=evilmc@list.ru \
            --namespace default \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to Kubernetes
        env:
          YC_REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          LB_PUBLIC_IP: ${{ secrets.LB_PUBLIC_IP }}
        run: |
          echo "Deploying image: cr.yandex/$YC_REGISTRY_ID/$IMAGE_NAME:$IMAGE_TAG"

          envsubst '${YC_REGISTRY_ID} ${IMAGE_NAME} ${IMAGE_TAG}' < k8s/deployment.yaml | kubectl apply -f -

          kubectl apply -f k8s/service.yaml

          envsubst '${LB_PUBLIC_IP}' < k8s/ingress.yaml | kubectl apply -f -

          echo "Waiting for rollout..."
          kubectl rollout status deployment/test-app -n default --timeout=300s

          echo "Current Pods:"
          kubectl get pods -l app=test-app -n default

      - name: Verify deployment
        run: |
          kubectl get deployment test-app -n default -o wide
          kubectl describe deployment test-app -n default
